[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/trade"
  to = "/trade/"
  status = 301

[[redirects]]
  from = "/trade/*"
  to = "/trade/index.html"
  status = 200

[[headers]]
  for = "/trade/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
